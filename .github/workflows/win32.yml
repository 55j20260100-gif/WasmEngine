name: Build Win32

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npx electron-builder --win --ia32

      - uses: actions/upload-artifact@v4
        with:
          name: app-win32
          path: dist/*.exe
